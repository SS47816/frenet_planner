[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frenet-planner"
version = "1.0.1"
description = "Renamed to fiss-planner: installs fiss-planner and keeps `import frenet_planner` working."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fiss-planner>=1.0.0"]

[project.urls]
Homepage = "https://github.com/SS47816/fiss_planner"
Documentation = "https://ss47816.github.io/fiss_planner/"

[tool.hatch.build.targets.wheel]
packages = ["frenet_planner"]
